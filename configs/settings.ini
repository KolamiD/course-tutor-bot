[Model]
model = t-tech/T-lite-it-1.0
max_new_tokens = 768
top_k = 50
top_p = 0.9
temperature = 0.5
gpu_memory_utilization = 0.1
use_swap_memory = False
swap_space_size = 64GiB
; таймаут на один вызов LLM (сек) — при превышении бот вернёт вежливый фолбэк
llm_timeout_seconds = 30

[Path_to_materials]
path = MATERIALS

[RAG]
top_k = 6
chunk_size = 1200
chunk_overlap = 200

[Hybrid]
; вес BM25 (точные термины/цифры) и векторного поиска (смысловая близость)
bm25_weight = 0.4
vector_weight = 0.6
; порог релевантности top-1 чанка (0..1). Ниже — считаем, что вопрос не по теме курса
relevance_threshold = 0.35

[VectorStore]
persist_directory = chroma_db
embedding_model = intfloat/multilingual-e5-large

[Memory]
; сколько последних пар (вопрос, ответ) хранить в памяти диалога на пользователя
history_max_turns = 4

[Course]
name = Введение в машинное обучение
