[Model]
; Для T-lite-it-1.0 (8B) нет ни AWQ/GPTQ-квантованной версии в открытом
; доступе, ни поддержки bitsandbytes в этом билде vLLM (см. README,
; "Раунд 5") — втиснуть её без потерь в бесплатный Colab T4 (16 ГБ) нечем.
; Для теста архитектуры на Colab используем модель поменьше из того же
; семейства (Qwen2.5) — тот же код пути в vLLM, тот же RAG/память/модерация,
; отличается только объём знаний и качество ответов самой LLM.
; Для продакшна на железе с достаточной VRAM верните
; model = t-tech/T-lite-it-1.0 и уберите/адаптируйте лимиты ниже.
model = Qwen/Qwen2.5-3B-Instruct
max_new_tokens = 512
top_k = 50
top_p = 0.9
temperature = 0.5
; 3B-модель в fp16 весит ~6 ГБ — квантование не требуется вообще
quantization =
; доля VRAM, отдаваемая под веса+KV-cache; т.к. embedding-модель теперь
; на CPU (см. [VectorStore] embedding_device), вся GPU-память свободна под
; LLM; с 3B-моделью запас большой, можно не экономить агрессивно
gpu_memory_utilization = 0.6
; с 3B-моделью на T4 есть запас — контекст можно не резать так жёстко
max_model_len = 8192
use_swap_memory = False
llm_timeout_seconds = 60

[Path_to_materials]
path = MATERIALS

[RAG]
top_k = 6
chunk_size = 1200
chunk_overlap = 200

[Hybrid]
bm25_weight = 0.4
vector_weight = 0.6
relevance_threshold = 0.35

[VectorStore]
persist_directory = chroma_db
embedding_model = intfloat/multilingual-e5-large
; На T4 (16 ГБ) держим embedding-модель на CPU, чтобы вся VRAM была
; свободна под LLM (иначе обе модели на GPU одновременно легко приводят
; к CUDA OOM при загрузке LLM). Чуть медленнее при индексации/поиске,
; но для демо-объёма материалов курса разница некритична.
embedding_device = cpu

[Memory]
history_max_turns = 4

[Course]
name = Введение в машинное обучение
